<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konversi Suhu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="termo" id="termo" aria-hidden="true">
    <div class="skala" id="skala"></div>
    <div class="tube"><div class="merkuri" id="merkuri"></div></div>
    <div class="bulb"></div>
  </div>

  <section>
    <div class="seg bahasa" role="group" aria-label="Bahasa / Language">
      <button type="button" data-l="id" aria-pressed="true">ID</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
    <h1 data-t="judul"></h1>
    <p class="sub" data-t="sub"></p>

    <div class="input-row">
      <input id="nilai" type="number" step="any" value="25" inputmode="decimal" data-a="aNilai">
      <div class="seg" role="group" data-a="aSatuan">
        <button type="button" data-u="C" aria-pressed="true">°C</button>
        <button type="button" data-u="F" aria-pressed="false">°F</button>
        <button type="button" data-u="K" aria-pressed="false">K</button>
      </div>
    </div>

    <ul class="hasil" id="hasil"></ul>
    <p class="pesan" id="pesan" role="alert"></p>

    <div class="contoh">
      <span data-t="coba"></span>
      <button type="button" data-c="0" data-t="beku"></button>
      <button type="button" data-c="36.6" data-t="tubuh"></button>
      <button type="button" data-c="100" data-t="didih"></button>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
