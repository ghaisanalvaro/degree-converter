<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Degree converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #d6e6df;
  --sheet: #f4f9f6;
  --ink: #10302b;
  --muted: #4f6b64;
  --line: #b9d0c7;
  --accent: #e0432a;
  --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1f1b;
    --sheet: #14302a;
    --ink: #e4f2ec;
    --muted: #8fb0a5;
    --line: #25463d;
    --accent: #ff6a4d;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 1.25rem;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
}
main {
  width: 100%;
  max-width: 40rem;
  display: grid;
  grid-template-columns: 5.5rem 1fr;
  gap: 1.5rem;
  background: var(--sheet);
  border: 2px solid var(--ink);
  border-radius: 6px;
  box-shadow: 7px 7px 0 var(--ink);
  padding: 1.75rem 1.5rem;
}

/* Termometer */
.termo { position: relative; height: 22rem; --warna: hsl(150 70% 45%); }
.tube {
  position: absolute; left: 2.6rem; width: 1.2rem; top: 0; bottom: 1.3rem;
  border: 2px solid var(--ink); border-bottom: 0;
  border-radius: 999px 999px 0 0;
  background: var(--sheet);
  overflow: hidden;
}
.merkuri {
  position: absolute; left: 0; right: 0; bottom: 0; height: 50%;
  background: var(--warna);
  transition: height .5s cubic-bezier(.3,.8,.3,1), background .5s;
}
.bulb {
  position: absolute; left: 1.95rem; bottom: 0; width: 2.5rem; height: 2.5rem;
  border-radius: 50%; border: 2px solid var(--ink);
  background: var(--warna); transition: background .5s;
}
.skala { position: absolute; left: 0; width: 2.4rem; top: 0; bottom: 1.3rem; }
.skala span {
  position: absolute; right: 0; transform: translateY(50%);
  font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums;
  padding-right: .55rem;
}
.skala span::after {
  content: ""; position: absolute; right: -.2rem; top: 50%;
  width: .4rem; height: 2px; background: var(--ink);
}

/* Panel kanan */
h1 { margin: 0; font-size: 2rem; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
.sub { margin: .4rem 0 1.25rem; color: var(--muted); }
.input-row { display: flex; align-items: flex-end; gap: .75rem; flex-wrap: wrap; }
#nilai {
  width: 100%; max-width: 10rem;
  font: 800 3rem/1 var(--font); letter-spacing: -.03em;
  color: var(--ink); background: transparent;
  border: 0; border-bottom: 3px solid var(--ink);
  padding: 0 0 .2rem; border-radius: 0;
}
#nilai:focus-visible { outline: none; border-color: var(--accent); }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
.seg button {
  font: 600 1rem var(--font); color: var(--ink); background: transparent;
  border: 0; padding: .5rem .85rem; cursor: pointer;
}
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.bahasa { margin-bottom: 1rem; }
.bahasa button { padding: .25rem .65rem; font-size: .85rem; }

.hasil { margin: 1.5rem 0 0; padding: 0; list-style: none; border-top: 2px solid var(--ink); }
.hasil li {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: .65rem 0; border-bottom: 1px solid var(--line);
}
.hasil .nama { color: var(--muted); }
.hasil strong { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.hasil li.asal strong { color: var(--accent); }

.contoh { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.contoh > span { color: var(--muted); font-size: .9rem; }
.contoh button {
  font: 400 .9rem var(--font); color: var(--ink); background: transparent;
  border: 1.5px solid var(--ink); border-radius: 999px; padding: .3rem .8rem; cursor: pointer;
}
.contoh button:hover { background: var(--ink); color: var(--sheet); }
.pesan { min-height: 1.3rem; margin: .75rem 0 0; color: var(--accent); font-size: .9rem; }

@media (max-width: 30rem) {
  main { grid-template-columns: 4.5rem 1fr; gap: 1rem; padding: 1.25rem 1rem; box-shadow: 5px 5px 0 var(--ink); }
  .termo { height: 20rem; }
  h1 { font-size: 1.6rem; }
  #nilai { font-size: 2.4rem; }
}
@media (prefers-reduced-motion: reduce) {
  .merkuri, .bulb { transition: none; }
}
</style>
</head>
<body>
<main>
  <div class="termo" id="termo" aria-hidden="true">
    <div class="skala" id="skala"></div>
    <div class="tube"><div class="merkuri" id="merkuri"></div></div>
    <div class="bulb"></div>
  </div>

  <section>
    <div class="seg bahasa" role="group" aria-label="Bahasa / Language">
      <button type="button" data-l="id" aria-pressed="true">ID</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
    <h1 data-t="judul"></h1>
    <p class="sub" data-t="sub"></p>

    <div class="input-row">
      <input id="nilai" type="number" step="any" value="25" inputmode="decimal" data-a="aNilai">
      <div class="seg" role="group" data-a="aSatuan">
        <button type="button" data-u="C" aria-pressed="true">°C</button>
        <button type="button" data-u="F" aria-pressed="false">°F</button>
        <button type="button" data-u="K" aria-pressed="false">K</button>
      </div>
    </div>

    <ul class="hasil" id="hasil"></ul>
    <p class="pesan" id="pesan" role="alert"></p>

    <div class="contoh">
      <span data-t="coba"></span>
      <button type="button" data-c="0" data-t="beku"></button>
      <button type="button" data-c="36.6" data-t="tubuh"></button>
      <button type="button" data-c="100" data-t="didih"></button>
    </div>
  </section>
</main>

<script>
const MIN = -40, MAX = 120;
const nilaiEl = document.getElementById("nilai");
const hasilEl = document.getElementById("hasil");
const pesanEl = document.getElementById("pesan");
const merkuriEl = document.getElementById("merkuri");
const termoEl = document.getElementById("termo");
const segBtns = document.querySelectorAll(".seg button");

const KAMUS = {
  id: {
    judul: "Berapa derajatnya?", sub: "Ketik suhu, dua satuan lainnya menyusul.",
    coba: "Coba:", beku: "Air membeku", tubuh: "Suhu tubuh", didih: "Air mendidih",
    aNilai: "Nilai suhu", aSatuan: "Satuan asal",
    kosong: "Masukkan angka untuk mulai konversi.",
    mutlak: "Tidak ada suhu di bawah nol mutlak (-273,15 °C).",
    C: "Celsius", F: "Fahrenheit", K: "Kelvin", locale: "id-ID"
  },
  en: {
    judul: "How many degrees?", sub: "Type a temperature, the other two units follow.",
    coba: "Try:", beku: "Freezing water", tubuh: "Body temperature", didih: "Boiling water",
    aNilai: "Temperature value", aSatuan: "Starting unit",
    kosong: "Enter a number to start converting.",
    mutlak: "Nothing is colder than absolute zero (-273.15 °C).",
    C: "Celsius", F: "Fahrenheit", K: "Kelvin", locale: "en-US"
  }
};
let bahasa = (navigator.language || "id").toLowerCase().startsWith("id") ? "id" : "en";
const t = k => KAMUS[bahasa][k];
const nama = new Proxy({}, { get: (_, u) => t(u) });
const simbol = { C: " °C", F: " °F", K: " K" };
let satuan = "C";

// Angka pada skala termometer
const skala = document.getElementById("skala");
[-40, 0, 40, 80, 120].forEach(t => {
  const s = document.createElement("span");
  s.textContent = t + "°";
  s.style.bottom = ((t - MIN) / (MAX - MIN) * 100) + "%";
  skala.appendChild(s);
});

const keC = (n, u) => u === "F" ? (n - 32) * 5 / 9 : u === "K" ? n - 273.15 : n;
const dariC = (c, u) => u === "F" ? c * 9 / 5 + 32 : u === "K" ? c + 273.15 : c;
const format = n => Number(n.toFixed(2)).toLocaleString(t("locale"));

function gambarTermometer(c) {
  const pct = Math.min(100, Math.max(3, (c - MIN) / (MAX - MIN) * 100));
  const hue = 210 - (pct / 100) * 202; // biru dingin ke merah panas
  merkuriEl.style.height = pct + "%";
  termoEl.style.setProperty("--warna", `hsl(${hue} 75% 48%)`);
}

function hitung() {
  const n = parseFloat(nilaiEl.value);
  hasilEl.innerHTML = "";
  pesanEl.textContent = "";

  if (Number.isNaN(n)) {
    pesanEl.textContent = t("kosong");
    return;
  }
  const c = keC(n, satuan);
  if (c < -273.15) {
    pesanEl.textContent = t("mutlak");
    return;
  }
  gambarTermometer(c);
  ["C", "F", "K"].forEach(u => {
    const li = document.createElement("li");
    if (u === satuan) li.className = "asal";
    li.innerHTML = `<span class="nama">${nama[u]}</span><strong>${format(dariC(c, u))}${simbol[u]}</strong>`;
    hasilEl.appendChild(li);
  });
}

function setSatuan(u) {
  satuan = u;
  segBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.u === u));
}

segBtns.forEach(b => b.addEventListener("click", () => {
  // Ubah angka ikut satuan baru supaya suhunya tetap sama
  const n = parseFloat(nilaiEl.value);
  if (!Number.isNaN(n)) nilaiEl.value = Number(dariC(keC(n, satuan), b.dataset.u).toFixed(2));
  setSatuan(b.dataset.u);
  hitung();
}));

document.querySelectorAll(".contoh button").forEach(b => b.addEventListener("click", () => {
  setSatuan("C");
  nilaiEl.value = b.dataset.c;
  hitung();
}));

function terapkanBahasa() {
  document.documentElement.lang = bahasa;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-a]").forEach(el => el.setAttribute("aria-label", t(el.dataset.a)));
  document.querySelectorAll(".bahasa button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === bahasa));
  hitung();
}
document.querySelectorAll(".bahasa button").forEach(b => b.addEventListener("click", () => {
  bahasa = b.dataset.l;
  terapkanBahasa();
}));

nilaiEl.addEventListener("input", hitung);
terapkanBahasa();
</script>
</body>
</html>
